name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "Version:           $TAG" x-fields.php
          grep -q "define( 'XFIELDS_VERSION', '$TAG' )" x-fields.php
          grep -q "Stable tag: $TAG" readme.txt
      - name: Build zip
        run: git archive --format=zip --prefix=x-fields/ -o x-fields-${GITHUB_REF_NAME}.zip HEAD
      - uses: softprops/action-gh-release@v3
        with:
          files: x-fields-${{ github.ref_name }}.zip
          generate_release_notes: true

  # Publish to WordPress.org. Lives here (not in a separate "on: release" workflow) because
  # releases created with GITHUB_TOKEN don't trigger other workflows.
  # Requires the repository secrets SVN_USERNAME and SVN_PASSWORD; skipped until they exist.
  wporg:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_SVN: ${{ secrets.SVN_USERNAME != '' && secrets.SVN_PASSWORD != '' }}
    steps:
      - name: Skip (WordPress.org credentials not configured)
        if: env.HAS_SVN != 'true'
        run: echo "SVN_USERNAME / SVN_PASSWORD not set; skipping WordPress.org deploy."
      - uses: actions/checkout@v7
        if: env.HAS_SVN == 'true'
      - name: Deploy plugin and assets to WordPress.org
        if: env.HAS_SVN == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: x-fields
          ASSETS_DIR: .wordpress-org
