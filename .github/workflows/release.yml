name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "Version:           $TAG" x-fields.php
          grep -q "define( 'XF_VERSION', '$TAG' )" x-fields.php
          grep -q "Stable tag: $TAG" readme.txt
      - name: Build zip
        run: git archive --format=zip --prefix=x-fields/ -o x-fields-${GITHUB_REF_NAME}.zip HEAD
      - uses: softprops/action-gh-release@v2
        with:
          files: x-fields-${{ github.ref_name }}.zip
          generate_release_notes: true
