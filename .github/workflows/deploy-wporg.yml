name: Deploy to WordPress.org

# Publishes each GitHub release to the WordPress.org plugin SVN repository.
# Requires the repository secrets SVN_USERNAME and SVN_PASSWORD (WordPress.org account).
# Until they exist, the job is skipped.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SVN: ${{ secrets.SVN_USERNAME != '' && secrets.SVN_PASSWORD != '' }}
    steps:
      - name: Skip (WordPress.org credentials not configured)
        if: env.HAS_SVN != 'true'
        run: echo "SVN_USERNAME / SVN_PASSWORD not set; skipping WordPress.org deploy."
      - uses: actions/checkout@v4
        if: env.HAS_SVN == 'true'
      - name: Deploy plugin and assets
        if: env.HAS_SVN == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: x-fields
          ASSETS_DIR: .wordpress-org
