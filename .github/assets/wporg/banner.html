<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1544px;height:500px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;color:#e8eefc;position:relative;
background:radial-gradient(900px 450px at 88% 10%,rgba(56,132,255,.32),transparent 60%),radial-gradient(700px 420px at 0% 100%,rgba(0,196,180,.18),transparent 60%),#0b1220}
body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,#000,rgba(0,0,0,.35) 60%,transparent)}
.wrap{position:relative;display:flex;align-items:center;height:100%;padding:0 96px;gap:64px}
.left{flex:1}
.brand{display:flex;align-items:center;gap:26px;margin-bottom:26px}
.logo{width:104px;height:104px;border-radius:28px;background:linear-gradient(135deg,#3884ff,#1a5fd6 55%,#00b8a9 130%);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(56,132,255,.35),inset 0 1px 0 rgba(255,255,255,.25);font-weight:800;font-size:48px;letter-spacing:-1px;color:#fff}
.logo span{opacity:.7}
h1{font-size:104px;font-weight:800;letter-spacing:-3.5px;line-height:1}
h1 em{font-style:normal;color:#6ea8ff}
p{font-size:34px;line-height:1.3;color:#b9c6e4;font-weight:500;max-width:760px}
p strong{color:#fff}
.card{width:520px;flex:0 0 520px;background:#fff;color:#1d2327;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:perspective(1400px) rotateY(-10deg) rotateX(3deg)}
.row{display:grid;grid-template-columns:24px 1.3fr 1fr 110px;gap:14px;align-items:center;padding:0 22px;height:60px;border-bottom:1px solid #f0f0f1}
.grip{width:12px;height:16px;background-image:radial-gradient(#a7aaad 1.4px,transparent 1.6px);background-size:6px 5.5px}
.l{font-size:17px;font-weight:700}
code{font:14px "SF Mono",Menlo,monospace;background:#f6f7f7;color:#50575e;padding:3px 8px;border-radius:4px;justify-self:start}
.t{justify-self:start;font-size:14px;font-weight:600;padding:3px 11px;border-radius:999px;background:rgba(34,113,177,.1);color:#2271b1}
.t.loop{background:#fcf0e3;color:#8a4d00}
.bar{display:flex;gap:8px;padding:16px 22px;background:#f6f7f7;border-bottom:1px solid #dcdcde}.bar i{width:12px;height:12px;border-radius:50%;background:#dcdcde}
</style></head><body><div class="wrap">
<div class="left"><div class="brand"><div class="logo">X<span>F</span></div><h1>X-<em>Fields</em></h1></div>
<p><strong>Simple, secure custom fields</strong> — groups, repeaters, relationships and front-end forms.</p></div>
<div class="card"><div class="bar"><i></i><i></i><i></i></div>
<div class="row"><span class="grip"></span><span class="l">Subtitle</span><code>subtitle</code><span class="t">Text</span></div>
<div class="row"><span class="grip"></span><span class="l">Event date</span><code>event_date</code><span class="t">Date</span></div>
<div class="row"><span class="grip"></span><span class="l">Related pages</span><code>related</code><span class="t">Relationship</span></div>
<div class="row"><span class="grip"></span><span class="l">FAQ</span><code>faq</code><span class="t loop">Loop</span></div>
</div></div></body></html>
