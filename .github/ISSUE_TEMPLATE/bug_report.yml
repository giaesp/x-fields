name: 🐞 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security issues must not be reported here** — use [private vulnerability reporting](https://github.com/giaesp/x-fields/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a field group with…
        2. Edit a page and…
        3. See error
    validations:
      required: true
  - type: input
    id: xf-version
    attributes:
      label: X-Fields version
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
      placeholder: "6.9"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors / logs
      description: PHP errors (`wp-content/debug.log`) or browser console errors, if any.
      render: shell
